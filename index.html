async function atualizarModelosPadrao(){
  var novos = presetsPadrao();
  var atualizados = 0, adicionados = 0;
  novos.forEach(function(np){
    var existente = state.profiles.find(function(p){ return p.isPreset && p.nome === np.nome; });
    if(existente){
      np.id = existente.id; /* preserva o id: clientes já vinculados continuam apontando certo */
      var idx = state.profiles.indexOf(existente);
      state.profiles[idx] = np;
      atualizados++;
    } else {
      state.profiles.push(np);
      adicionados++;
    }
  });
  await saveProfiles();
  renderTabContent();
  toast('Modelos padrão atualizados (' + atualizados + ' corrigidos, ' + adicionados + ' novos). Clientes e orçamentos não foram alterados.');
}

}

}

var authMsg = null; /* {tipo:'error'|'info', texto} */

function renderAuthConfigWarning(motivo){
  var texto = motivo === 'sdk'
    ? '<p>A biblioteca do Supabase não carregou (conexão instável, bloqueador de scripts, ou o CDN está fora do ar). Verifique sua internet e recarregue a página.</p>'
    : '<p>Este arquivo precisa da URL e da anon key do seu projeto Supabase para funcionar. Abra o arquivo, procure por <code>SUPABASE_URL</code> e <code>SUPABASE_ANON_KEY</code> perto do início do &lt;script&gt;, e cole os valores do seu projeto (Painel do Supabase → Settings → API). Depois, rode o script <code>setup-supabase.sql</code> uma vez no SQL Editor do Supabase.</p>';
  document.getElementById('auth-root').innerHTML =
    '<div class="auth-config-warning">' +
      '<h2 style="font-family:var(--serif);margin-top:0">' + (motivo==='sdk' ? 'Não foi possível carregar o Supabase' : 'Supabase ainda não configurado') + '</h2>' +
      texto +
    '</div>';
  document.getElementById('app-root').style.display = 'none';
}

function renderAuthScreen(){
  var msgHtml = authMsg ? '<div class="auth-msg ' + authMsg.tipo + '">' + escapeHtml(authMsg.texto) + '</div>' : '';
  document.getElementById('auth-root').innerHTML =
    '<div class="auth-screen"><div class="auth-card">' +
      '<div class="brand" style="flex-direction:column;text-align:center;margin-bottom:18px">' + sunIconSvg(96) + '<span style="color:var(--ink-soft);font-size:12.5px;margin-top:6px">orçamentos de aluguel de usinas</span></div>' +
      '<div class="auth-tabs">' +
        '<button class="auth-tab-btn' + (authMode==='signin'?' active':'') + '" data-action="auth-set-mode" data-mode="signin">Entrar</button>' +
        '<button class="auth-tab-btn' + (authMode==='signup'?' active':'') + '" data-action="auth-set-mode" data-mode="signup">Criar conta</button>' +
      '</div>' +
      msgHtml +
      '<div class="field"><label>E-mail</label><input type="text" id="auth-email" autocomplete="username" placeholder="voce@exemplo.com"></div>' +
      '<div class="field"><label>Senha</label><input type="password" id="auth-password" autocomplete="' + (authMode==='signin'?'current-password':'new-password') + '" placeholder="••••••••"></div>' +
      '<div class="btn-row"><button class="btn btn-primary btn-block" style="width:100%;justify-content:center" data-action="' + (authMode==='signin'?'sign-in':'sign-up') + '">' + (authMode==='signin'?'Entrar':'Criar conta') + '</button></div>' +
    '</div></div>';
  document.getElementById('app-root').style.display = 'none';
}

function setAuthMode(mode){ authMode = mode; authMsg = null; renderAuthScreen(); }

async function onSignIn(){
  var email = txt('auth-email'), senha = document.getElementById('auth-password').value;
  if(!email || !senha){ authMsg = {tipo:'error', texto:'Preencha e-mail e senha.'}; renderAuthScreen(); return; }
  var resp = await supabaseClient.auth.signInWithPassword({ email: email, password: senha });
  if(resp.error){ authMsg = {tipo:'error', texto: resp.error.message}; renderAuthScreen(); return; }
  /* onAuthStateChange cuida do resto (carregar dados e mostrar o app) */
}
async function onSignUp(){
  var email = txt('auth-email'), senha = document.getElementById('auth-password').value;
  if(!email || !senha){ authMsg = {tipo:'error', texto:'Preencha e-mail e senha.'}; renderAuthScreen(); return; }
  if(senha.length < 6){ authMsg = {tipo:'error', texto:'A senha precisa ter pelo menos 6 caracteres.'}; renderAuthScreen(); return; }
  var resp = await supabaseClient.auth.signUp({ email: email, password: senha });
  if(resp.error){ authMsg = {tipo:'error', texto: resp.error.message}; renderAuthScreen(); return; }
  if(resp.data && resp.data.user && !resp.data.session){
    authMsg = {tipo:'info', texto:'Conta criada! Verifique seu e-mail para confirmar antes de entrar.'};
    authMode = 'signin';
    renderAuthScreen();
  }
  /* se a confirmação por e-mail estiver desativada no projeto, já vem uma sessão pronta
     e onAuthStateChange cuida de mostrar o app automaticamente. */
}
async function onSignOut(){
  await supabaseClient.auth.signOut();
  /* onAuthStateChange cuida de limpar o estado e voltar pra tela de login */
}

async function aoLogar(user){
  currentUser = user;
  document.getElementById('auth-root').innerHTML = '';
  document.getElementById('app-root').style.display = '';
  state.profiles = []; state.clients = []; state.quotes = []; state.docConfig = docConfigPadrao();
  state.selectedClientId = null; state.activeTab = 'novo'; state.editingProfileId = null; state.lastDraft = null;
  await loadAll();
  renderAll();
}
function aoDeslogar(){
  currentUser = null;
  state.profiles = []; state.clients = []; state.quotes = []; state.docConfig = docConfigPadrao();
  state.selectedClientId = null; state.lastDraft = null;
  authMsg = null; authMode = 'signin';
  renderAuthScreen();
}

/* ============================================================
   RENDER GERAL
   ============================================================ */
function renderTabContent(){
  var el = document.getElementById('tab-content');
  el.style.opacity = '0';
  el.style.transform = 'translateY(6px)';
  if(state.activeTab === 'novo') renderNovoOrcamento();
  else if(state.activeTab === 'historico') renderHistorico();
  else if(state.activeTab === 'perfis') renderPerfis();
  else renderConfig();
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    });
  });
}
function renderAll(){ renderSidebar(); renderTopbar(); renderTabs(); renderTabContent(); }

/* ============================================================
   EVENTOS (DELEGAÇÃO)
   ============================================================ */
document.addEventListener('input', function(e){
  if(e.target.classList && e.target.classList.contains('v-rotulo')){
    var row = e.target.closest('.var-row');
    var chaveInput = row ? row.querySelector('.v-chave') : null;
    if(chaveInput && chaveInput.dataset.touched !== '1'){ chaveInput.value = slugify(e.target.value); }
  }
  if(e.target.classList && e.target.classList.contains('v-chave')){ e.target.dataset.touched = '1'; }
});

/* Auto-salva um rascunho local (com atraso curto) sempre que o usuário digita
   nos campos do orçamento — assim, se a página recarregar (ex.: ao abrir um
   PDF gerado e voltar), o que já foi digitado não se perde. */
var _rascunhoTimer = null;
document.addEventListener('input', function(e){
  var t = e.target;
  var relevante = t.id === 'f-ref' || t.id === 'f-ajuste' || t.id === 'f-observacoes' ||
    (t.classList && (t.classList.contains('in-mensal') || t.classList.contains('item-nome') || t.classList.contains('item-val')));
  if(!relevante) return;
  clearTimeout(_rascunhoTimer);
  _rascunhoTimer = setTimeout(salvarRascunhoAtual, 400);
});

document.addEventListener('click', function(e){
  var overlay = e.target.closest('[data-action="close-modal-bg"]');
  if(overlay && !e.target.closest('[data-stop-close]')){ closeModal(); return; }

  var el = e.target.closest('[data-action]');
  if(!el) return;
  var action = el.dataset.action;
  var id = el.dataset.id;

  switch(action){
    case 'auth-set-mode': setAuthMode(el.dataset.mode); break;
    case 'sign-in': onSignIn(); break;
    case 'sign-up': onSignUp(); break;
    case 'sign-out': onSignOut(); break;

    case 'select-client': selectClient(id); break;
    case 'new-client': openClientModal(null); break;
    case 'edit-client': openClientModal(id); break;
    case 'delete-client-confirm': handleConfirmClick(el, function(){ deleteClient(id); }); break;
    case 'close-modal': closeModal(); break;
    case 'save-client': saveClientFromModal(id || null); break;
    case 'set-tab': setTab(el.dataset.tab); break;

    case 'add-ponto': addPontoRow(); break;
    case 'remove-ponto': removePontoRow(id); break;
    case 'calcular': onCalcular(); break;
    case 'salvar-historico': onSalvarHistorico(); break;
    case 'copiar-carta': copiarTexto(state.lastDraft ? state.lastDraft.letter : ''); break;
    case 'baixar-txt': baixarTxt(state.lastDraft ? state.lastDraft.letter : '', 'orcamento-' + (state.lastDraft?state.lastDraft.referencia:'')); break;
    case 'baixar-doc': baixarDoc(state.lastDraft ? state.lastDraft.letter : '', 'orcamento-' + (state.lastDraft?state.lastDraft.referencia:'')); break;
    case 'baixar-pdf': baixarPdf('cliente'); break;
    case 'baixar-pdf-interno': baixarPdf('interno'); break;
    case 'imprimir': window.print(); break;

    case 'duplicar-quote': duplicarQuote(id); break;
    case 'delete-quote-confirm': handleConfirmClick(el, function(){ deleteQuote(id); }); break;

    case 'new-profile': onNewProfile(); break;
    case 'edit-profile': onEditProfile(id); break;
    case 'duplicate-profile': onDuplicateProfile(id); break;
    case 'delete-profile-confirm': handleConfirmClick(el, function(){ onDeleteProfile(id); }); break;
    case 'cancel-edit-profile': onCancelEditProfile(); break;
    case 'save-profile': onSaveProfile(el.dataset.new === '1'); break;
    case 'testar-formulas': onTestarFormulas(); break;
    case 'add-var-row': addVarRow(); break;
    case 'remove-var-row': removeVarRow(id); break;
    case 'add-itemvar-row': addItemVarRow(); break;
    case 'remove-itemvar-row': removeItemVarRow(id); break;

    case 'atualizar-modelos-padrao': atualizarModelosPadrao(); break;
    case 'remove-logo': removerLogo(); break;
    case 'salvar-doc-config': salvarDocConfig(); break;
    case 'reset-all-confirm': handleConfirmClick(el, function(){ resetAllData(); }); break;
  }
});

/* ============================================================
   INIT
   ============================================================ */
(async function init(){
  if(!SUPABASE_CONFIGURADO){ renderAuthConfigWarning('config'); return; }
  if(!SUPABASE_SDK_OK){ renderAuthConfigWarning('sdk'); return; }

  supabaseClient.auth.onAuthStateChange(function(event, session){
    if(session && session.user){
      if(!currentUser || currentUser.id !== session.user.id){ aoLogar(session.user); }
    } else {
      if(currentUser){ aoDeslogar(); } else { renderAuthScreen(); }
    }
  });

  var sessionResp = await supabaseClient.auth.getSession();
  if(sessionResp.data && sessionResp.data.session && sessionResp.data.session.user){
    await aoLogar(sessionResp.data.session.user);
  } else {
    renderAuthScreen();
  }
})();

})();
</script>
